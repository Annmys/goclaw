<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450">
  <style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:16}.deny{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:16}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:16}.title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}.text{font:600 20px "Microsoft YaHei",sans-serif;fill:#1e293b}.small{font:16px "Microsoft YaHei",sans-serif;fill:#475569}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <rect class="bg" width="1100" height="450"/><text x="550" y="50" text-anchor="middle" class="title">安全与 RBAC 权限流程</text>
  <rect x="70" y="165" width="170" height="90" class="box"/><text x="155" y="202" text-anchor="middle" class="text">登录身份</text><text x="155" y="230" text-anchor="middle" class="small">用户 ID / Token</text>
  <rect x="300" y="165" width="170" height="90" class="box"/><text x="385" y="202" text-anchor="middle" class="text">租户角色</text><text x="385" y="230" text-anchor="middle" class="small">owner / admin / user</text>
  <rect x="530" y="165" width="170" height="90" class="box"/><text x="615" y="202" text-anchor="middle" class="text">资源授权</text><text x="615" y="230" text-anchor="middle" class="small">Agent / Skill / Tool</text>
  <rect x="760" y="100" width="170" height="80" class="ok"/><text x="845" y="135" text-anchor="middle" class="text">允许执行</text><text x="845" y="160" text-anchor="middle" class="small">记录审计</text>
  <rect x="760" y="260" width="170" height="80" class="deny"/><text x="845" y="295" text-anchor="middle" class="text">拒绝访问</text><text x="845" y="320" text-anchor="middle" class="small">返回权限错误</text>
  <line x1="240" y1="210" x2="300" y2="210" class="arrow"/><line x1="470" y1="210" x2="530" y2="210" class="arrow"/><line x1="700" y1="190" x2="760" y2="140" class="arrow"/><line x1="700" y1="230" x2="760" y2="300" class="arrow"/>
</svg>
