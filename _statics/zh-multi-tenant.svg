<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">
  <style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:16}.tenant{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:18}.title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}.text{font:600 20px "Microsoft YaHei",sans-serif;fill:#1e293b}.small{font:16px "Microsoft YaHei",sans-serif;fill:#475569}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <rect class="bg" width="1100" height="500"/><text x="550" y="50" text-anchor="middle" class="title">多租户权限与数据隔离</text>
  <rect x="60" y="120" width="180" height="90" class="box"/><text x="150" y="158" text-anchor="middle" class="text">用户登录</text><text x="150" y="185" text-anchor="middle" class="small">用户 ID + Token</text>
  <rect x="310" y="120" width="190" height="90" class="box"/><text x="405" y="158" text-anchor="middle" class="text">租户识别</text><text x="405" y="185" text-anchor="middle" class="small">组织 / 角色 / 范围</text>
  <rect x="580" y="80" width="440" height="150" class="tenant"/><text x="800" y="118" text-anchor="middle" class="text">租户 A</text><text x="800" y="150" text-anchor="middle" class="small">成员、Agent、Skill、知识库、会话、文件</text><text x="800" y="185" text-anchor="middle" class="small">只访问本租户授权资源</text>
  <rect x="580" y="280" width="440" height="150" class="tenant"/><text x="800" y="318" text-anchor="middle" class="text">租户 B</text><text x="800" y="350" text-anchor="middle" class="small">成员、Agent、Skill、知识库、会话、文件</text><text x="800" y="385" text-anchor="middle" class="small">与租户 A 数据隔离</text>
  <line x1="240" y1="165" x2="310" y2="165" class="arrow"/><line x1="500" y1="150" x2="580" y2="140" class="arrow"/><line x1="500" y1="182" x2="580" y2="335" class="arrow"/>
</svg>
