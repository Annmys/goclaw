<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460">
  <style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:16}.title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}.text{font:600 20px "Microsoft YaHei",sans-serif;fill:#1e293b}.small{font:16px "Microsoft YaHei",sans-serif;fill:#475569}.arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <rect class="bg" width="1100" height="460"/><text x="550" y="50" text-anchor="middle" class="title">Agent Team 协作流程</text>
  <rect x="60" y="170" width="180" height="100" class="box"/><text x="150" y="212" text-anchor="middle" class="text">用户需求</text><text x="150" y="240" text-anchor="middle" class="small">文件 / 指令 / 反馈</text>
  <rect x="310" y="170" width="180" height="100" class="box"/><text x="400" y="212" text-anchor="middle" class="text">调度专员</text><text x="400" y="240" text-anchor="middle" class="small">拆任务 / 分配 / 汇总</text>
  <rect x="570" y="80" width="180" height="90" class="box"/><text x="660" y="118" text-anchor="middle" class="text">业务专员</text><text x="660" y="145" text-anchor="middle" class="small">执行 Skill</text>
  <rect x="570" y="205" width="180" height="90" class="box"/><text x="660" y="243" text-anchor="middle" class="text">审核专员</text><text x="660" y="270" text-anchor="middle" class="small">数据与格式检查</text>
  <rect x="570" y="330" width="180" height="90" class="box"/><text x="660" y="368" text-anchor="middle" class="text">知识专员</text><text x="660" y="395" text-anchor="middle" class="small">沉淀规则</text>
  <rect x="840" y="170" width="190" height="100" class="box"/><text x="935" y="212" text-anchor="middle" class="text">最终结果</text><text x="935" y="240" text-anchor="middle" class="small">文件 / 记录 / 规则</text>
  <line x1="240" y1="220" x2="310" y2="220" class="arrow"/><line x1="490" y1="205" x2="570" y2="125" class="arrow"/><line x1="490" y1="220" x2="570" y2="250" class="arrow"/><line x1="490" y1="235" x2="570" y2="375" class="arrow"/><line x1="750" y1="250" x2="840" y2="220" class="arrow"/>
</svg>
