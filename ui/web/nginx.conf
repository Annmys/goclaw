server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Docker internal DNS resolver — re-resolves upstream when backend
    # container restarts with a new IP (prevents stale DNS cache).
    # Note: valid=10s means up to 10s stale DNS on backend restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_backend "http://goclaw:18790";

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Keep the SPA entry fresh so clients pick up new asset hashes after upgrades.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # WebSocket proxy
    location /ws {
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # API proxy
    location /v1/ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Long-running endpoints (workflow run / AI generate / EPL) can take
        # minutes while an agent calls the LLM and processes files. Default 60s
        # causes 504 Gateway Time-out; raise to 10 minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # Health check proxy
    location /health {
        proxy_pass $upstream_backend;
    }

    # SPA fallback — serve index.html for all other routes
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
}
